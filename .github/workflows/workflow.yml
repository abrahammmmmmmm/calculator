name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          ACCF0D: ${{ secrets.ACCF0D }}
          BCB51B: ${{ secrets.BCB51B }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('ACCF0D', '')
          sec_b = os.environ.get('BCB51B', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 24eb0ce21c9f071c981816ad80 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- b456892a419c109b31c8c0e6f116db6737 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
